<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      H-5: baseline Content-Security-Policy for the SPA. 'unsafe-inline' on
      style-src is required by React inline style props + Google Fonts; the JS
      bundle is loaded from 'self'. Tuned for the assets this app actually uses
      (Google Fonts, https/data images, same-origin API + Socket.IO).
      NOTE: frame-ancestors and Strict-Transport-Security can't be set via a meta
      tag — set those (and ideally this CSP itself) as HTTP response headers at
      the reverse proxy / static host serving this build.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'" />
    <title>BORAROC — Management Panel</title>
    <link rel="icon" href="/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
